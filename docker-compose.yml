services:
  zeebee-staff-app:
    build: .
    image: zeebee-staff-app:latest
    container_name: zeebee-staff-app
    restart: unless-stopped
    ports:
      - "8129:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ZPORTAL_DB_PATH=/app/data/portal.db
      - ZPORTAL_JWT_SECRET=${ZPORTAL_JWT_SECRET}
    volumes:
      - zeebee-staff-data:/app/data
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true

volumes:
  zeebee-staff-data:
